<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live EN ↔ BG Translator</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 20px;
    }
    h2 { text-align: center; }
    select, button {
      width: 100%;
      padding: 16px;
      margin-top: 16px;
      font-size: 18px;
      border-radius: 14px;
      border: none;
    }
    select {
      background: #020617;
      color: #e5e7eb;
    }
    button {
      background: #2563eb;
      color: white;
      font-weight: bold;
    }
    button.holding {
      background: #1e40af;
    }
    .box {
      margin-top: 20px;
      padding: 15px;
      background: #020617;
      border-radius: 12px;
      min-height: 60px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<h2>🎧 Live EN ↔ BG Translator</h2>

<select id="direction">
  <option value="en-bg">English → Bulgarian</option>
  <option value="bg-en">Bulgarian → English</option>
  <option value="pl-bg">Polish → Bulgarian</option>
  <option value="bg-pl">Bulgarian → Polish</option>
</select>


<button id="talkBtn">🎤 Hold to Talk</button>

<div class="box">
  <strong>You said:</strong>
  <div id="sourceText"></div>
</div>

<div class="box">
  <strong>Translation:</strong>
  <div id="translatedText"></div>
</div>

<script>
const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

const talkBtn = document.getElementById("talkBtn");
const sourceDiv = document.getElementById("sourceText");
const translatedDiv = document.getElementById("translatedText");
const directionSelect = document.getElementById("direction");

let recognition = null;
let isHolding = false;
let finalTranscript = "";

function createRecognition() {
  const r = new SpeechRecognition();
  const direction = directionSelect.value;
  r.lang = direction === "en-bg" ? "en-US" : "bg-BG";
  r.interimResults = true;

  r.onresult = (event) => {
    let text = "";
    for (let i = 0; i < event.results.length; i++) {
      text += event.results[i][0].transcript;
    }
    finalTranscript = text;
    sourceDiv.textContent = text;
  };

  r.onend = () => {
    // 🔁 ако бутонът още е натиснат – рестартираме
    if (isHolding) {
      recognition = createRecognition();
      recognition.start();
    }
  };

  return r;
}

function startListening() {
  speechSynthesis.cancel();
  finalTranscript = "";
  isHolding = true;

  recognition = createRecognition();
  recognition.start();
}

async function stopListening() {
  isHolding = false;
  if (recognition) recognition.stop();

  if (!finalTranscript.trim()) return;

  const direction = directionSelect.value;
  const langPair = direction === "en-bg" ? "en|bg" : "bg|en";
  const ttsLang  = direction === "en-bg" ? "bg-BG" : "en-US";

  try {
    const response = await fetch(
      "https://api.mymemory.translated.net/get?q=" +
      encodeURIComponent(finalTranscript) +
      "&langpair=" + langPair
    );
    const data = await response.json();
    const translated = data.responseData.translatedText;
    translatedDiv.textContent = translated;

    const utter = new SpeechSynthesisUtterance(translated);
    utter.lang = ttsLang;
    utter.rate = 0.9;
    speechSynthesis.speak(utter);
  } catch {
    translatedDiv.textContent = "Translation error.";
  }
}

/* TOUCH */
talkBtn.addEventListener("touchstart", e => {
  e.preventDefault();
  talkBtn.classList.add("holding");
  startListening();
});
talkBtn.addEventListener("touchend", e => {
  e.preventDefault();
  talkBtn.classList.remove("holding");
  stopListening();
});

/* MOUSE */
talkBtn.addEventListener("mousedown", () => {
  talkBtn.classList.add("holding");
  startListening();
});
talkBtn.addEventListener("mouseup", () => {
  talkBtn.classList.remove("holding");
  stopListening();
});
</script>

</body>
</html>
