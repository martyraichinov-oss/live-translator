<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Translator</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 20px;
    }
    h2 { text-align: center; }
    select, button {
      width: 100%;
      padding: 16px;
      margin-top: 16px;
      font-size: 18px;
      border-radius: 14px;
      border: none;
    }
    select { background: #020617; color: #e5e7eb; }
    button {
      background: #2563eb;
      color: white;
      font-weight: bold;
    }
    button.holding { background: #1e40af; }
    .box {
      margin-top: 20px;
      padding: 15px;
      background: #020617;
      border-radius: 12px;
      min-height: 60px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<h2>🎧 Live Translator</h2>

<select id="direction">
  <option value="en-bg">English → Bulgarian</option>
  <option value="bg-en">Bulgarian → English</option>

  <option value="pl-bg">Polish → Bulgarian</option>
  <option value="bg-pl">Bulgarian → Polish</option>

  <option value="el-bg">Greek → Bulgarian</option>
  <option value="bg-el">Bulgarian → Greek</option>
</select>

<button id="talkBtn">🎤 Hold to Talk</button>

<div class="box">
  <strong>You said:</strong>
  <div id="sourceText"></div>
</div>

<div class="box">
  <strong>Translation:</strong>
  <div id="translatedText"></div>
</div>

<script>
const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

const talkBtn = document.getElementById("talkBtn");
const sourceDiv = document.getElementById("sourceText");
const translatedDiv = document.getElementById("translatedText");
const directionSelect = document.getElementById("direction");

/* 🌍 ЕЗИКОВА КОНФИГУРАЦИЯ */
const LANG_MAP = {
  "en-bg": { speech: "en-US", translate: "en|bg", tts: "bg-BG" },
  "bg-en": { speech: "bg-BG", translate: "bg|en", tts: "en-US" },

  "pl-bg": { speech: "pl-PL", translate: "pl|bg", tts: "bg-BG" },
  "bg-pl": { speech: "bg-BG", translate: "bg|pl", tts: "pl-PL" },

  "el-bg": { speech: "el-GR", translate: "el|bg", tts: "bg-BG" },
  "bg-el": { speech: "bg-BG", translate: "bg|el", tts: "el-GR" }
};

let recognition = null;
let isHolding = false;
let finalTranscript = "";

function createRecognition() {
  const r = new SpeechRecognition();
  const cfg = LANG_MAP[directionSelect.value];

  r.lang = cfg.speech;
  r.interimResults = true;

  r.onresult = (event) => {
    let text = "";
    for (let i = 0; i < event.results.length; i++) {
      text += event.results[i][0].transcript;
    }
    finalTranscript = text;
    sourceDiv.textContent = text;
  };

  return r;
}

function startListening() {
  if (recognition) {
    recognition.onresult = null;
    recognition = null;
  }

  speechSynthesis.cancel();
  finalTranscript = "";
  sourceDiv.textContent = "";
  translatedDiv.textContent = "";

  isHolding = true;
  recognition = createRecognition();
  recognition.start();
}

async function stopListening() {
  isHolding = false;
  if (!recognition) return;
  recognition.stop();

  if (!finalTranscript.trim()) {
    translatedDiv.textContent = "⚠️ No speech detected.";
    return;
  }

  const cfg = LANG_MAP[directionSelect.value];
  translatedDiv.textContent = "⏳ Translating...";

  try {
    const response = await fetch(
      "https://api.mymemory.translated.net/get?q=" +
      encodeURIComponent(finalTranscript) +
      "&langpair=" + cfg.translate
    );

    const data = await response.json();
    let translated = "";

    if (data.responseData?.translatedText) {
      translated = data.responseData.translatedText;
    } else if (data.matches?.length) {
      translated = data.matches[0].translation;
    }

    if (!translated) {
      translatedDiv.textContent = "⚠️ Translation not available.";
      return;
    }

    translatedDiv.textContent = translated;

    const utter = new SpeechSynthesisUtterance(translated);
    utter.lang = cfg.tts;
    utter.rate = 0.9;
    speechSynthesis.speak(utter);

  } catch {
    translatedDiv.textContent = "❌ Translation error.";
  }
}

/* TOUCH */
talkBtn.addEventListener("touchstart", e => {
  e.preventDefault();
  talkBtn.classList.add("holding");
  startListening();
});
talkBtn.addEventListener("touchend", e => {
  e.preventDefault();
  talkBtn.classList.remove("holding");
  stopListening();
});

/* MOUSE */
talkBtn.addEventListener("mousedown", () => {
  talkBtn.classList.add("holding");
  startListening();
});
talkBtn.addEventListener("mouseup", () => {
  talkBtn.classList.remove("holding");
  stopListening();
});
</script>

</body>
</html>
