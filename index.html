<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Translator</title>

<style>
body {
  font-family: system-ui, sans-serif;
  background:#0f172a;
  color:#e5e7eb;
  padding:20px;
}
button, select {
  width:100%;
  padding:16px;
  font-size:18px;
  border-radius:14px;
  border:none;
  margin-top:16px;
}
button {
  background:#2563eb;
  color:white;
  font-weight:bold;
}
.box {
  background:#020617;
  padding:15px;
  margin-top:20px;
  border-radius:12px;
  min-height:60px;
}
</style>
</head>

<body>

<h2>🎧 Live Translator</h2>

<select id="direction">
  <option value="en-bg">English → Bulgarian</option>
  <option value="bg-en">Bulgarian → English</option>
  <option value="pl-bg">Polish → Bulgarian</option>
  <option value="bg-pl">Bulgarian → Polish</option>
  <option value="el-bg">Greek → Bulgarian</option>
  <option value="bg-el">Bulgarian → Greek</option>
</select>

<button id="startBtn">🎤 Tap to Speak</button>

<div class="box">
<b>You said:</b>
<div id="src"></div>
</div>

<div class="box">
<b>Translation:</b>
<div id="tr"></div>
</div>

<script>
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

const LANG_MAP = {
  "en-bg": { speech:"en-US", translate:"en|bg", tts:"bg-BG" },
  "bg-en": { speech:"bg-BG", translate:"bg|en", tts:"en-US" },
  "pl-bg": { speech:"pl-PL", translate:"pl|bg", tts:"bg-BG" },
  "bg-pl": { speech:"bg-BG", translate:"bg|pl", tts:"pl-PL" },
  "el-bg": { speech:"el-GR", translate:"el|bg", tts:"bg-BG" },
  "bg-el": { speech:"bg-BG", translate:"bg|el", tts:"el-GR" }
};

const btn = document.getElementById("startBtn");
const src = document.getElementById("src");
const tr = document.getElementById("tr");
const dir = document.getElementById("direction");

btn.addEventListener("click", () => {
  src.textContent = "";
  tr.textContent = "🎤 Listening…";
  speechSynthesis.cancel();

  const cfg = LANG_MAP[dir.value];
  const rec = new SpeechRecognition();
  rec.lang = cfg.speech;
  rec.interimResults = false;

  rec.onresult = async e => {
    const text = e.results[0][0].transcript;
    src.textContent = text;
    tr.textContent = "⏳ Translating…";

    try {
      const res = await fetch(
        `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${cfg.translate}`
      );
      const data = await res.json();
      const translated = data.responseData?.translatedText || data.matches?.[0]?.translation;

      if (!translated) {
        tr.textContent = "⚠️ Translation unavailable";
        return;
      }

      tr.textContent = translated;
      const utter = new SpeechSynthesisUtterance(translated);
      utter.lang = cfg.tts;
      speechSynthesis.speak(utter);

    } catch {
      tr.textContent = "❌ Translation error";
    }
  };

  rec.start();
});
</script>

</body>
</html>
